# The data release's manifest-v1.json, which setup fetches to learn what it can install: the model catalogue
# (packaging/data/manifest-base.json), every map-entry-*.json and addresses-entry-*.json among data-v1's files, and the
# starter pack's starter-entry.json when it is there, checked by `lastbook-tools build-manifest` as setup checks a
# manifest, then put into the release (packaging/data/write-manifest.sh, which the Regions and Library workflows also run
# after each region and pack). Runs at the end of each Regions run, and by hand (Actions, Data manifest, Run workflow).
# Only data-v1 is changed, a draft or published; no other release is touched.
name: Data manifest

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write   # a draft release is seen, and added to, only with write access

jobs:
  manifest:
    name: manifest-v1.json
    runs-on: ubuntu-24.04
    env:
      RELEASE: data-v1
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p lastbook-tools
      - name: manifest-v1.json, from what the release holds now, into it
        run: BRANCH="${GITHUB_REF_NAME}" packaging/data/write-manifest.sh "$GITHUB_STEP_SUMMARY"
