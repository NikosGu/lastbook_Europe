# The starter library that may be published, built on GitHub's machines only when asked: the documents of
# content/library/starter.json whose terms let them be passed on ("redistribute": "yes"), each downloaded from its
# publisher and checked against the size and SHA-256 the list gives, read with the PDFium pinned in
# packaging/rust/pdfium.txt, packed, and uploaded with its manifest entry to the data release (data-v1), which stays a
# draft until the maintainer publishes it. No other release is touched, and nothing is published here.
name: Library

on:
  workflow_dispatch:

permissions:
  contents: write   # to upload to the data release, and to make it as a draft if it is not there

concurrency:
  group: data-v1   # one upload to the data release at a time
  cancel-in-progress: false

jobs:
  starter:
    name: Starter library (what may be passed on)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TAG: data-v1   # crates/engine/src/dist.rs DATA_TAG: where setup downloads the data from
      LIST: content/library/starter.json
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: The tools
        run: cargo build --release --locked -p lastbook-tools
      - name: PDFium, the build pinned in packaging/rust/pdfium.txt
        run: packaging/rust/pdfium.sh pdfium-linux-x64.tgz "$RUNNER_TEMP/pdfium/lib" "$RUNNER_TEMP/pdfium/licences"
      - name: The documents that may be passed on, from their publishers
        run: |
          mkdir -p "$RUNNER_TEMP/docs"
          jq -r '.documents[] | select(.redistribute == "yes") | [.id, .file, .url] | @tsv' "$LIST" > "$RUNNER_TEMP/wanted.tsv"
          test -s "$RUNNER_TEMP/wanted.tsv"
          while IFS=$'\t' read -r id file url; do
            echo "$id: $url"
            if ! curl -fsSL --retry 3 --retry-delay 10 -A "lastbook-tools/0.1 (offline library builder)" -o "$RUNNER_TEMP/docs/$file" "$url"; then
              echo "$id: $url could not be downloaded (a publisher may turn automated downloads away, and that is respected): nothing is uploaded" >&2
              exit 1
            fi
          done < "$RUNNER_TEMP/wanted.tsv"
          ls -l "$RUNNER_TEMP/docs"
      - name: Build the library (each document checked against its size and SHA-256)
        env:
          LASTBOOK_PDFIUM: ${{ runner.temp }}/pdfium/lib
        run: |
          # the date of its content revision, so the same revision builds the same bytes
          BUILT=$(jq -r '.pack.redistributable.revision' "$LIST" | grep -oE '^[0-9]{4}-[0-9]{2}-[0-9]{2}' || date -u +%F)
          target/release/lastbook-tools build-library --sources "$LIST" --docs "$RUNNER_TEMP/docs" \
            --out "$RUNNER_TEMP/starter/LastbookData" --redistributable-only --built "$BUILT"
      - name: Pack it, with its manifest entry
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          target/release/lastbook-tools build-pack --data "$RUNNER_TEMP/starter/LastbookData" --out "$RUNNER_TEMP/out" \
            --base "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" > "$RUNNER_TEMP/out/starter-entry.json"
          cat "$RUNNER_TEMP/out/starter-entry.json"
      - name: Nothing of the other documents is in the zip
        run: |
          ZIP="$RUNNER_TEMP/out/Lastbook-starter.zip"
          unzip -Z1 "$ZIP" > "$RUNNER_TEMP/zip-files.txt"
          jq -r '.documents[] | select(.redistribute != "yes") | "LastbookData/library-data/documents/\(.file)", "LastbookData/library-data/pages/\(.file)", "LastbookData/library-data/text/\(.id).txt"' "$LIST" > "$RUNNER_TEMP/not-here.txt"
          if grep -xFf "$RUNNER_TEMP/not-here.txt" "$RUNNER_TEMP/zip-files.txt"; then
            echo "files of documents that may not be passed on are in the zip" >&2; exit 1
          fi
          # its catalog lists only the documents marked yes, and the Sources page
          unzip -p "$ZIP" LastbookData/library-data/catalog.json | jq -r '.[].id' | sort > "$RUNNER_TEMP/listed.txt"
          { jq -r '.documents[] | select(.redistribute == "yes") | .id' "$LIST"; echo lastbook-sources; } | sort > "$RUNNER_TEMP/allowed.txt"
          diff "$RUNNER_TEMP/allowed.txt" "$RUNNER_TEMP/listed.txt"
          echo "$(wc -l < "$RUNNER_TEMP/listed.txt") records, each a document that may be passed on (or the Sources page)"
      - name: Upload to the data release (a draft until the maintainer publishes it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # drafts are not found by their tag, so the list of releases is read; a failure to read it stops here
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq '.[].tag_name' > "$RUNNER_TEMP/tags.txt"
          if ! grep -qxF "$TAG" "$RUNNER_TEMP/tags.txt"; then
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Lastbook Europe data (v1)" \
              --notes "The data Lastbook Europe downloads during setup: the library packs, the region maps, the address indexes and their manifest (manifest-v1.json). A draft until the maintainer publishes it: setup downloads only from a published release."
          fi
          gh release upload "$TAG" "$RUNNER_TEMP/out/Lastbook-starter.zip" "$RUNNER_TEMP/out/starter-entry.json" --clobber
          gh release view "$TAG" --json isDraft,assets --jq '"draft: \(.isDraft); files: \([.assets[].name] | join(", "))"'
