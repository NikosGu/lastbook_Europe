# The starter library that may be published, built on GitHub's machines only when asked: the documents of
# content/library/starter.json whose terms let them be passed on ("redistribute": "yes"), each downloaded from its
# publisher (or, where a publisher turns GitHub's machines away, from this repository's copy of it in the draft release
# sources-v1, made by packaging/data/library-release.sh sources) and checked against the size and SHA-256 the list
# gives, read with the PDFium pinned in packaging/rust/pdfium.txt, packed, checked, and uploaded with its manifest entry
# to the data release (data-v1), which stays a draft until the maintainer publishes it. No other release is touched, and
# nothing is published here.
name: Library

on:
  workflow_dispatch:

permissions:
  contents: write   # to upload to the data release, and to make it as a draft if it is not there

concurrency:
  group: data-v1   # one upload to the data release at a time
  cancel-in-progress: false

jobs:
  starter:
    name: Starter library (what may be passed on)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TAG: data-v1   # crates/engine/src/dist.rs DATA_TAG: where setup downloads the data from
      SOURCES_TAG: sources-v1   # the copies of the documents that may be passed on (packaging/data/library-release.sh)
      LIST: content/library/starter.json
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: The tools
        run: cargo build --release --locked -p lastbook-tools
      - name: PDFium, the build pinned in packaging/rust/pdfium.txt
        run: packaging/rust/pdfium.sh pdfium-linux-x64.tgz "$RUNNER_TEMP/pdfium/lib" "$RUNNER_TEMP/pdfium/licences"
      - name: The documents that may be passed on, from their publishers or this repository's copy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/docs"
          jq -r '.documents[] | select(.redistribute == "yes") | [.id, .file, .url] | @tsv' "$LIST" > "$RUNNER_TEMP/wanted.tsv"
          test -s "$RUNNER_TEMP/wanted.tsv"
          while IFS=$'\t' read -r id file url; do
            if curl -fsSL --retry 3 --retry-delay 10 -A "lastbook-tools/0.1 (offline library builder)" -o "$RUNNER_TEMP/docs/$file" "$url"; then
              echo "$id: from its publisher, $url"
            else
              # a publisher may turn GitHub's machines away, and that is respected: the document's terms let it be passed
              # on, so this repository keeps a copy in the draft release sources-v1 (packaging/data/library-release.sh
              # sources), checked below against the list like any download
              rm -f "$RUNNER_TEMP/docs/$file"
              echo "$id: $url turned this machine away; taken from this repository's copy in $SOURCES_TAG"
              gh release download "$SOURCES_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$file" --dir "$RUNNER_TEMP/docs" \
                || { echo "$id: not in $SOURCES_TAG either: nothing is uploaded" >&2; exit 1; }
            fi
          done < "$RUNNER_TEMP/wanted.tsv"
          ls -l "$RUNNER_TEMP/docs"
      - name: Build the library (each document checked against its size and SHA-256)
        env:
          LASTBOOK_PDFIUM: ${{ runner.temp }}/pdfium/lib
        run: |
          # the date of its content revision, so the same revision builds the same bytes
          BUILT=$(jq -r '.pack.redistributable.revision' "$LIST" | grep -oE '^[0-9]{4}-[0-9]{2}-[0-9]{2}' || date -u +%F)
          target/release/lastbook-tools build-library --sources "$LIST" --docs "$RUNNER_TEMP/docs" \
            --out "$RUNNER_TEMP/starter/LastbookData" --redistributable-only --built "$BUILT"
      - name: Pack it, with its manifest entry
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          target/release/lastbook-tools build-pack --data "$RUNNER_TEMP/starter/LastbookData" --out "$RUNNER_TEMP/out" \
            --base "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" > "$RUNNER_TEMP/out/starter-entry.json"
          cat "$RUNNER_TEMP/out/starter-entry.json"
      - name: Nothing of the other documents is in the zip, and the entry names it
        run: packaging/data/library-release.sh check "$RUNNER_TEMP/out/Lastbook-starter.zip" "$RUNNER_TEMP/out/starter-entry.json"
      - name: Upload to the data release (a draft until the maintainer publishes it)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET: ${{ github.sha }}
        run: |
          packaging/data/library-release.sh starter "$RUNNER_TEMP/out/Lastbook-starter.zip" "$RUNNER_TEMP/out/starter-entry.json"
          gh release view "$TAG" --repo "$REPO" --json isDraft,assets --jq '"draft: \(.isDraft); files: \([.assets[].name] | join(", "))"'
