# The tests of the whole Rust workspace on the three systems the app is built for. No library and no model: the tests
# make their own small data.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same branch replaces a run still going
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Rust app: the engine, the window, the local AI runner (llama.cpp, built from source: Metal on macOS, the CPU
  # elsewhere for now) and the data tools. No model is downloaded: the runner's tests check its protocol without one.
  rust:
    name: Rust, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux webview libraries, and libclang for llama.cpp's bindings
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libclang-dev cmake
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Pictures of the app (setup, with no library), to look at
        shell: bash
        run: |
          mkdir -p shots
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get install -y -qq xvfb >/dev/null; RUN="xvfb-run -a"; else RUN=""; fi
          T=""; if command -v timeout >/dev/null; then T="timeout 180"; fi   # macOS has no timeout; the app quits after its picture anyway
          $T $RUN ./target/debug/lastbook --home "$RUNNER_TEMP/lb-home" --size 1000x800 --after 6 --snapshot "shots/$RUNNER_OS-setup.png"
          ls -la shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ matrix.os }}
          path: shots/*
          if-no-files-found: ignore

  # The local AI runner with Vulkan (graphics cards on Windows and Linux), being made to build here: it does not hold the
  # other jobs back while it fails.
  vulkan:
    name: Runner with Vulkan, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    env:
      # short on Windows: the shader generator's build lies deep inside llama.cpp's, past Windows' 260-character paths
      CARGO_TARGET_DIR: ${{ matrix.os == 'windows-2022' && 'C:/t' || 'target' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: vulkan
      - name: Vulkan (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev cmake ninja-build libvulkan-dev glslc spirv-headers
      - name: Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: latest
          install_runtime: true
          cache: true
      - name: The compiler's environment (Windows), for Ninja
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      # llama-cpp-sys-2 copies its shared libraries to the folder three levels above its OUT_DIR, and to "deps" in it.
      # With Cargo's newer layout (build/<crate>/<hash>/out) that folder is target/debug/build, which has no "deps".
      - name: Build the runner with Vulkan (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$CARGO_TARGET_DIR/debug/build/deps"
          cargo build -p lastbook-llm --features vulkan --locked
      - name: Build the runner with Vulkan (Windows)
        if: runner.os == 'Windows'
        # PowerShell, not bash: Git's bash finds its own "link" before Visual Studio's linker
        shell: pwsh
        env:
          CMAKE_GENERATOR: Ninja
        run: |
          New-Item -ItemType Directory -Force -Path "$env:CARGO_TARGET_DIR/debug/build/deps" | Out-Null
          cargo build -p lastbook-llm --features vulkan --locked
      - name: llama.cpp's libraries beside the runner, as the installers put them
        shell: bash
        run: |
          T="$CARGO_TARGET_DIR/debug"
          for d in $(find "$T/build" -type d -path '*llama-cpp-sys-2*/out' -prune); do
            if [ -n "$(ls "$d"/lib/libggml-base.so* "$d"/bin/ggml-base.dll 2>/dev/null)" ]; then OUT="$d"; fi
          done
          echo "llama.cpp's output: $OUT"
          cp -P "$OUT"/lib/*.so* "$T/" 2>/dev/null || true
          cp "$OUT"/bin/*.dll "$T/" 2>/dev/null || true
          if [ -d "$OUT/backends" ]; then cp -P "$OUT"/backends/* "$T/"; fi
          ls "$T" | grep -Ei 'ggml|llama' || true
      - name: The runner answers
        shell: bash
        run: '"$CARGO_TARGET_DIR/debug/lastbook-llm" || test $? -eq 2'
