# The tests of the whole Rust workspace on the three systems the app is built for. No library and no model: the tests
# make their own small data.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same branch replaces a run still going
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Rust app: the engine, the window, the local AI runner (llama.cpp, built from source: Metal on macOS, the CPU
  # elsewhere for now) and the data tools. No model is downloaded: the runner's tests check its protocol without one.
  rust:
    name: Rust, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux webview libraries, libclang for llama.cpp's bindings, and Vulkan for its graphics backend
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libclang-dev cmake libvulkan-dev glslc spirv-headers
      - name: Vulkan SDK (Windows), for llama.cpp's graphics backend
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: latest
          install_runtime: true
          cache: true
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Pictures of the app (setup, with no library), to look at
        shell: bash
        run: |
          mkdir -p shots
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get install -y -qq xvfb >/dev/null; RUN="xvfb-run -a"; else RUN=""; fi
          T=""; if command -v timeout >/dev/null; then T="timeout 180"; fi   # macOS has no timeout; the app quits after its picture anyway
          $T $RUN ./target/debug/lastbook --home "$RUNNER_TEMP/lb-home" --size 1000x800 --after 6 --snapshot "shots/$RUNNER_OS-setup.png"
          ls -la shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ matrix.os }}
          path: shots/*
          if-no-files-found: ignore
