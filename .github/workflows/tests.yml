# The tests of the whole Rust workspace on the three systems the app is built for. No library and no model: the tests
# make their own small data.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The Rust app: the engine, the window, the local AI runner (llama.cpp, built from source: Metal on macOS, the CPU
  # elsewhere for now) and the data tools. No model is downloaded: the runner's tests check its protocol without one.
  rust:
    name: Rust, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux webview libraries, and libclang for llama.cpp's bindings
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libclang-dev cmake
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked
