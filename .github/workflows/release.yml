# Installers for macOS, Windows and Linux, built on GitHub's machines and put in a draft release, which the maintainer
# publishes. A version tag (v1.2.3) makes that release; a push to the working branch updates the preview draft.
name: Release

on:
  workflow_dispatch:
  push:
    branches: [europe-fase-0-1]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux build libraries, and Vulkan for llama.cpp's graphics backend
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libclang-dev cmake libvulkan-dev glslc spirv-headers
      - name: Vulkan SDK (Windows), for llama.cpp's graphics backend
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: latest
          install_runtime: true
          cache: true
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: bash packaging/rust/package_macos.sh dist
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: bash packaging/rust/package_linux.sh dist
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: powershell -ExecutionPolicy Bypass -File packaging\rust\package_windows.ps1 -Out dist
      - name: The packaged app opens (macOS, a picture of its first page)
        if: runner.os == 'macOS'
        run: |
          hdiutil attach -nobrowse -readonly dist/*.dmg -mountpoint /tmp/lb
          mkdir -p shots
          "/tmp/lb/Lastbook Europe.app/Contents/MacOS/lastbook" --home "$RUNNER_TEMP/lb-home" --size 1000x800 --after 4 --snapshot shots/macos-setup.png
          hdiutil detach /tmp/lb
      - name: The packaged runner answers (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/*.deb
          /opt/lastbook-europe/lastbook-llm || test $? -eq 2
      # A library of one PDF page of our own (packaging/rust/check-library), built with lastbook-tools and the PDFium the
      # package holds, then the packaged app opened on that page, finding its PDFium by itself: a picture to look at, and
      # the page's drawing in the library's cache, which only PDFium makes.
      - name: The packaged app draws a PDF page (a picture of it)
        shell: bash
        run: |
          cargo build --release --locked -p lastbook-tools --bin lastbook-tools
          TMP_SH="$RUNNER_TEMP"; RUN=""
          case "$RUNNER_OS" in
            macOS)
              hdiutil attach -nobrowse -readonly dist/*.dmg -mountpoint /tmp/lb
              APP="/tmp/lb/Lastbook Europe.app/Contents/MacOS/lastbook"; PDFIUM="/tmp/lb/Lastbook Europe.app/Contents/Frameworks" ;;
            Linux)
              sudo apt-get install -y -qq xvfb >/dev/null
              APP=/opt/lastbook-europe/lastbook; PDFIUM=/opt/lastbook-europe; RUN="xvfb-run -a" ;;
            Windows)
              pwsh -NoProfile -Command "Expand-Archive -Path (Get-Item dist/*-windows-x64.zip).FullName -DestinationPath '$RUNNER_TEMP\lb-app'"
              TMP_SH="$(cygpath -u "$RUNNER_TEMP")"
              APP="$TMP_SH/lb-app/lastbook.exe"; PDFIUM="$RUNNER_TEMP\lb-app" ;;
          esac
          LASTBOOK_PDFIUM="$PDFIUM" target/release/lastbook-tools build-library --sources packaging/rust/check-library/sources.json \
            --docs packaging/rust/check-library --out "$RUNNER_TEMP/check/LastbookData"
          mkdir -p shots
          T=""; if command -v timeout >/dev/null; then T="timeout 180"; fi   # macOS has no timeout; the app quits after its picture anyway
          $T $RUN "$APP" --data "$RUNNER_TEMP/check/LastbookData" --home "$RUNNER_TEMP/lb-check" --size 1000x800 --after 4 \
            --eval "location.hash='#/read/pdf-page-check?p=1&view=page'" --eval 0 --eval 0 --snapshot "shots/$RUNNER_OS-pdf-page.png"
          if [ "$RUNNER_OS" = macOS ]; then hdiutil detach /tmp/lb; fi
          test -s "shots/$RUNNER_OS-pdf-page.png"
          ls "$TMP_SH/check/LastbookData/derived/cache" | grep '^pdf-page-check-1-[0-9]*\.png$'
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ matrix.os }}
          path: shots/*
          if-no-files-found: ignore

  release:
    name: Draft release
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true
      - name: Make or update the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(bash packaging/rust/version.sh)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="$GITHUB_REF_NAME"; TITLE="Lastbook Europe ${TAG#v}"; else TAG="v$VER-preview"; TITLE="Lastbook Europe $VER (preview)"; fi
          # an earlier draft with this tag goes (a published release is never touched)
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id"); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG is already published: left as it is"; exit 0
          fi
          { cat packaging/rust/RELEASE_NOTES.md; echo; echo "Built from ${GITHUB_SHA::12}."; } > notes.md
          gh release create "$TAG" dist/* --draft --prerelease --target "$GITHUB_SHA" --title "$TITLE" --notes-file notes.md
          ls -la dist
