# Region maps built on GitHub's machines, only when asked, into the data release: each region in its own job, one at a
# time, from its public sources to the zips setup downloads and their manifest entries, checked as setup takes them and
# as a person uses them (packaging/regions/build-region.sh, docs/MAPS.md). Each region's zips and entries go into the
# release tagged data-v1, a draft or published, and manifest-v1.json is written again after each region and at the end
# (packaging/data/write-manifest.sh, data-manifest.yml). A run in which some region failed starts the next pass by itself, for its regions still
# missing, up to the fourth: Geofabrik turns some of GitHub's machines away for hours, and a new job is usually given
# another machine. Nothing here publishes a release, and no other release is touched.
name: Regions

on:
  workflow_dispatch:
    inputs:
      regions:
        description: "missing: every region the data-v1 draft does not hold yet; all: every region; or region codes (crates/engine/src/regions.rs) in the order to build them, separated by spaces or commas, as CH AT LI"
        required: true
        default: "missing"
      neighbours:
        description: "Take the neighbours' extracts too, read only inside each region's boxes: those under 300 MB, and larger ones already in this week's cache"
        type: boolean
        default: true
      pass:
        description: "Which pass this is (1 to 4): a run in which a region failed starts the next pass, for its regions still missing, until the fourth"
        default: "1"

permissions:
  contents: read

# one run at a time adds to the data release
concurrency:
  group: data-release
  cancel-in-progress: false

env:
  RELEASE: data-v1
  GH_REPO: ${{ github.repository }}

jobs:
  plan:
    name: The regions to build
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # a draft release is seen, and made, only with write access
    outputs:
      regions: ${{ steps.list.outputs.regions }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: crates/tools/data
      - name: The data release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # every release tagged so, drafts included (the list shows them to writers; a failure to read it stops here)
          n=$(gh api "repos/$GH_REPO/releases?per_page=100" --paginate --jq ".[] | select(.tag_name == \"$RELEASE\") | .id" | wc -l | tr -d ' ')
          case "$n" in
            0)
              gh release create "$RELEASE" --draft --target "$GITHUB_SHA" --title "Lastbook Europe data" \
                --notes "The region maps, address indexes and packs setup downloads, and manifest-v1.json, which lists them. Built by the Regions and Library workflows." ;;
            1) ;;   # a draft, or published: a region is added to it as soon as it is built, and the manifest after it
            *)
              # two releases under one tag would split the data between them
              echo "$n releases are tagged $RELEASE: keep one" >&2
              exit 1 ;;
          esac
      - name: The regions asked for, in the order to build them
        id: list
        env:
          REGIONS: ${{ inputs.regions }}
          PASS: ${{ inputs.pass }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -f   # the input is split into words, never read as file names
          # every region, those that share an extract one after another, so that the cache serves the next
          order=$(jq -r '.regions | to_entries | sort_by(.value.extracts[0], .key) | .[].key' crates/tools/data/region-sources.json)
          case "$REGIONS" in
            all)
              want=$order ;;
            missing)
              have=$(gh release view "$RELEASE" --json assets --jq '.assets[] | select(.state == null or .state == "uploaded") | .name')
              want=$(for r in $order; do
                for f in "Lastbook-Map-$r.zip" "Lastbook-Addresses-$r.zip" "map-entry-$r.json" "addresses-entry-$r.json"; do
                  if ! grep -qxF "$f" <<<"$have"; then echo "$r"; break; fi
                done
              done) ;;
            *)
              # in the order given: a small region after its large neighbours finds them in the cache
              want=$(for r in ${REGIONS//,/ }; do
                if grep -qxF "$r" <<<"$order"; then echo "$r"; else echo "not a region of the table: $r" >&2; fi
              done | awk '!seen[$0]++')
              if [ -z "$want" ]; then echo "no region of the table in: $REGIONS" >&2; exit 1; fi ;;
          esac
          list=$(printf '%s\n' $want | jq -R . | jq -sc 'map(select(length > 0))')
          echo "regions=$list" >> "$GITHUB_OUTPUT"
          echo "Pass ${PASS:-1}: $(jq length <<<"$list") regions to build: $(jq -r 'join(" ")' <<<"$list")" | tee -a "$GITHUB_STEP_SUMMARY"

  tools:
    name: The tools
    needs: plan
    if: needs.plan.outputs.regions != '[]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p lastbook-tools
      - uses: actions/upload-artifact@v4
        with:
          name: lastbook-tools
          path: target/release/lastbook-tools
          retention-days: 30
          overwrite: true

  region:
    name: ${{ matrix.region }}
    needs: [plan, tools]
    if: needs.plan.outputs.regions != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write   # the zips go into the data release
    strategy:
      fail-fast: false
      max-parallel: 1   # one at a time: Geofabrik, shared by everyone, turns away GitHub's machines when they ask too much
      matrix:
        region: ${{ fromJSON(needs.plan.outputs.regions) }}
    env:
      REGION: ${{ matrix.region }}
      NEIGHBOURS: ${{ inputs.neighbours && 'yes' || 'no' }}
      # on whichever of the runner's disks has more room, always under this name (the cache restores to it): Norway's
      # sources and build take some 20 GB
      DATA: /mnt/lastbook
      TOOLS: /mnt/lastbook/bin/lastbook-tools
      SOURCES: /mnt/lastbook/sources
      OUT: /mnt/lastbook/regions
    steps:
      - uses: actions/checkout@v4
      - name: Room on the disk, and memory to spare
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          second=$(df --output=avail -k /mnt 2>/dev/null | tail -n 1 || echo 0)
          system=$(df --output=avail -k "$HOME" | tail -n 1)
          sudo mkdir -p "$(dirname "$DATA")"
          if [ "${second:-0}" -ge "$system" ]; then
            sudo mkdir -p "$DATA"
            sudo chown "$(id -u):$(id -g)" "$DATA"
          else
            mkdir -p "$HOME/lastbook"
            sudo ln -sfn "$HOME/lastbook" "$DATA"
          fi
          # a swap file beside the data: a region larger than the memory slows down rather than stops
          if [ "$(df --output=avail -k "$DATA/" | tail -n 1)" -gt $((40 * 1024 * 1024)) ]; then
            sudo fallocate -l 16G "$DATA/swap" && sudo chmod 600 "$DATA/swap" && sudo mkswap "$DATA/swap" >/dev/null && sudo swapon "$DATA/swap" \
              || echo "no swap file added" >&2
          fi
          df -h / /mnt "$DATA/" || true
          free -h
      - uses: actions/download-artifact@v4
        with:
          name: lastbook-tools
          path: ${{ env.DATA }}/bin
      - name: What to fetch
        id: sources
        run: |
          chmod +x "$TOOLS"
          "$TOOLS" region-sources --region "$REGION" --neighbours "$NEIGHBOURS" > "$RUNNER_TEMP/sources.json"
          # each Geofabrik extract kept in the cache for the ISO week, under its own name, its two files; Natural Earth's
          # six zips for good
          jq --arg s "$SOURCES" --arg w "$(date -u +%G-W%V)" '[(.extracts + .neighbours)[] | (.path | gsub("/"; "_")) as $f
              | {path: "\($s)/geofabrik/\($f)", key: "geofabrik-\($f)-\($w)", files: 2}]
              + [{path: "\($s)/ne", key: "natural-earth-10m", files: (.natural_earth | length)}]' \
            "$RUNNER_TEMP/sources.json" > "$RUNNER_TEMP/caches.json"
          # GitHub's own cache library, for a number of entries a workflow's steps cannot list in advance; without it,
          # everything is fetched
          npm install --silent --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/js" @actions/cache@4 \
            || echo "::warning::GitHub's cache library could not be installed: every source is fetched"
      - name: This week's downloads, from the cache
        uses: actions/github-script@v7
        continue-on-error: true   # a cache that cannot be read only means fetching
        env:
          ACTIONS_CACHE_SERVICE_V2: "true"
        with:
          script: |
            const fs = require('fs')
            const temp = process.env.RUNNER_TEMP
            const cache = require(`${temp}/js/node_modules/@actions/cache`)
            const found = []
            for (const c of JSON.parse(fs.readFileSync(`${temp}/caches.json`))) {
              try {
                if (await cache.restoreCache([c.path], c.key)) found.push(c.key)
                core.info(`${c.key}: ${found.includes(c.key) ? 'from the cache' : 'not in the cache'}`)
              } catch (e) {
                // what a broken restore left is not taken for whole files
                fs.rmSync(c.path, { recursive: true, force: true })
                core.warning(`${c.key}: the cache could not be read (${e.message}); fetched instead`)
              }
            }
            fs.writeFileSync(`${temp}/from-cache.json`, JSON.stringify(found))
      - name: Fetch
        env:
          FETCH_ONLY: 1
        run: packaging/regions/build-region.sh "$REGION" "$NEIGHBOURS"
      - name: This week's downloads, into the cache
        if: always() && steps.sources.outcome == 'success'
        uses: actions/github-script@v7
        continue-on-error: true   # a cache that cannot be written only means fetching next time
        env:
          ACTIONS_CACHE_SERVICE_V2: "true"
        with:
          script: |
            const fs = require('fs')
            const temp = process.env.RUNNER_TEMP
            const cache = require(`${temp}/js/node_modules/@actions/cache`)
            const found = fs.existsSync(`${temp}/from-cache.json`) ? JSON.parse(fs.readFileSync(`${temp}/from-cache.json`)) : []
            for (const c of JSON.parse(fs.readFileSync(`${temp}/caches.json`))) {
              // a folder kept only with all its files, none of them half fetched: a neighbour left out has none
              const whole = fs.existsSync(c.path) && fs.readdirSync(c.path).filter(f => !f.endsWith('.part')).length >= c.files
                && !fs.readdirSync(c.path).some(f => f.endsWith('.part'))
              if (found.includes(c.key) || !whole) continue
              try {
                await cache.saveCache([c.path], c.key)
                core.info(`${c.key}: kept`)
              } catch (e) {
                core.warning(`${c.key}: not kept (${e.message})`)
              }
            }
      - name: Build, pack and check
        env:
          OFFLINE: 1
        run: |
          packaging/regions/build-region.sh "$REGION" "$NEIGHBOURS"
          df -h / "$DATA/"
      - name: Into the data release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          packs="$OUT/$REGION/packs"
          n=$(gh api "repos/$GH_REPO/releases?per_page=100" --paginate --jq ".[] | select(.tag_name == \"$RELEASE\") | .id" | wc -l | tr -d ' ')
          if [ "$n" != 1 ]; then
            echo "$n releases are tagged $RELEASE, not one: nothing is added" >&2
            exit 1
          fi
          # upload FILE...: tried again after a broken connection; --clobber replaces a file already there
          upload() {
            local try
            for try in 1 2 3; do
              gh release upload "$RELEASE" "$@" --clobber && return 0
              sleep $((try * 30))
            done
            return 1
          }
          # the old entries first and the new ones last: an entry never stands beside another build's zip
          for f in "map-entry-$REGION.json" "addresses-entry-$REGION.json"; do
            gh release delete-asset "$RELEASE" "$f" --yes 2>/dev/null || true
          done
          upload "$packs/Lastbook-Map-$REGION.zip" "$packs/Lastbook-Addresses-$REGION.zip"
          upload "$packs/map-entry-$REGION.json" "$packs/addresses-entry-$REGION.json"
      - name: The data release's manifest, with this region
        env:
          GH_TOKEN: ${{ github.token }}
        # setup offers a region once the manifest lists it: written now, not only at the end of the run
        run: BRANCH="${GITHUB_REF_NAME}" packaging/data/write-manifest.sh "$GITHUB_STEP_SUMMARY"
      - name: What it made
        if: always()
        run: |
          {
            echo "### $REGION"
            tail -n 1 "$OUT/$REGION/time.txt" 2>/dev/null || true
            jq -r '.files[0] | "- \(.name): \(.size / 1000000 | floor) MB"' "$OUT/$REGION/packs/map-entry-$REGION.json" "$OUT/$REGION/packs/addresses-entry-$REGION.json" 2>/dev/null || true
            jq -r '.checks[] | "- \(if .ok then "ok" else "FAILED" end): \(.check), \(.detail)"' "$OUT/$REGION/packs/check-$REGION.json" 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: region-${{ matrix.region }}
          path: |
            ${{ env.OUT }}/${{ matrix.region }}/packs/*.json
            ${{ env.OUT }}/${{ matrix.region }}/build-report.json
            ${{ env.OUT }}/${{ matrix.region }}/time.txt
          if-no-files-found: warn
          overwrite: true   # a job run again replaces its first try's
      - name: A pause before the next region, for Geofabrik
        if: always()
        run: sleep 120

  manifest:
    name: The data release's manifest
    needs: [plan, region]
    if: always() && needs.plan.result == 'success'
    permissions:
      contents: write
    uses: ./.github/workflows/data-manifest.yml

  again:
    name: The next pass, for this run's regions still missing
    needs: [plan, region, manifest]
    if: always() && needs.plan.result == 'success' && needs.region.result == 'failure'
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # a draft release is seen only with write access
      actions: write    # to start this workflow again
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PASS: ${{ inputs.pass }}
          NEIGHBOURS: ${{ inputs.neighbours }}
          REGIONS: ${{ needs.plan.outputs.regions }}
        run: |
          pass=${PASS:-1}
          case "$pass" in [1-9]) ;; *) echo "pass \"$pass\" is not a number from 1 to 4" >&2; exit 1 ;; esac
          # this run's regions that the release still lacks, as the plan counts them (the others of the table are not
          # this run's to build)
          have=$(gh release view "$RELEASE" --json assets --jq '.assets[] | select(.state == null or .state == "uploaded") | .name')
          still=$(for r in $(jq -r '.[]' <<<"$REGIONS"); do
            for f in "Lastbook-Map-$r.zip" "Lastbook-Addresses-$r.zip" "map-entry-$r.json" "addresses-entry-$r.json"; do
              if ! grep -qxF "$f" <<<"$have"; then echo "$r"; break; fi
            done
          done | tr '\n' ' ' | sed 's/ $//')
          if [ -z "$still" ]; then
            echo "Every region of this run is in the release" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$pass" -ge 4 ]; then
            echo "Pass $pass was the last: $still wait for a run started by hand" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # it waits for this run to end (one run at a time adds to the data release)
          gh workflow run regions.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f regions="$still" -f neighbours="$NEIGHBOURS" -f pass=$((pass + 1))
          echo "Pass $((pass + 1)) asked for, for $still: it starts when this run ends" | tee -a "$GITHUB_STEP_SUMMARY"
