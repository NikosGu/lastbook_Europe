# Region maps built on GitHub's machines, only when asked: each region in its own job, from its public sources to the
# zips setup downloads and their manifest entries, checked as setup takes them and as a person uses them
# (packaging/regions/build-region.sh, docs/MAPS.md). The zips, the entries and the check come back as the job's artifact.
name: Regions

on:
  workflow_dispatch:
    inputs:
      regions:
        description: "Region codes (crates/engine/src/regions.rs), separated by spaces or commas, as LI MT LU DE-HB"
        required: true
        default: "LI"
      neighbours:
        description: "Take the neighbours' extracts too, read only inside each region's boxes (larger downloads)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    name: The regions asked for
    runs-on: ubuntu-24.04
    outputs:
      regions: ${{ steps.list.outputs.regions }}
    steps:
      - id: list
        env:
          REGIONS: ${{ inputs.regions }}
        run: |
          set -f   # the input is split into words, never read as file names
          list=$(printf '%s\n' ${REGIONS//,/ } | grep -E '^[A-Z]{2}(-[A-Z0-9]{1,3})?$' | sort -u | jq -R . | jq -sc .)
          echo "regions=$list" >> "$GITHUB_OUTPUT"
          echo "$list"
          if [ "$list" = "[]" ]; then echo "no region code in: $REGIONS" >&2; exit 1; fi

  region:
    name: ${{ matrix.region }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        region: ${{ fromJSON(needs.plan.outputs.regions) }}
    steps:
      - uses: actions/checkout@v4
      - name: Room on the disk (toolchains of the runner's this job does not use)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: The tools
        run: cargo build --release --locked -p lastbook-tools
      - name: Fetch, build, pack and check
        env:
          REGION: ${{ matrix.region }}
          NEIGHBOURS: ${{ inputs.neighbours && 'yes' || 'no' }}
          SOURCES: ${{ runner.temp }}/sources
          OUT: ${{ runner.temp }}/regions
        run: |
          packaging/regions/build-region.sh "$REGION" "$NEIGHBOURS"
          df -h /
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: region-${{ matrix.region }}
          path: |
            ${{ runner.temp }}/regions/${{ matrix.region }}/packs/
            ${{ runner.temp }}/regions/${{ matrix.region }}/build-report.json
          if-no-files-found: warn
