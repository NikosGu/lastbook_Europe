# Every build of llama.cpp in this workspace goes through crates/llm/llama/lastbook.cmake: without its model downloader,
# so the local AI runner cannot reach the network, and able to give a graphics processor copies of its weights.
# llama-cpp-sys-2 passes CMAKE_* variables on to llama.cpp's CMake.
[env]
CMAKE_PROJECT_INCLUDE = { value = "crates/llm/llama/lastbook.cmake", relative = true }
# llama-cpp-sys-2 rebuilds llama.cpp when a GGML_* variable changes, not when the CMake file above does: change this
# value whenever crates/llm/llama/ changes. A build folder configured with an older version of these files keeps that
# configuration: cargo clean -p llama-cpp-sys-2 (CI's cache keys follow these files by themselves).
GGML_LASTBOOK_BUILD = "2"
