[package]
name = "lastbook-tools"
description = "Lastbook Europe's build tools: region boxes, region maps, address indexes, library packs. Never shipped."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
default-run = "lastbook-tools"

[dependencies]
lastbook-engine = { path = "../engine" }
serde_json.workspace = true
rusqlite = { version = "0.43", features = ["bundled"] }
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_latest", "thread_safe"] }
lol_html = "3"
html-escape = "0.2"
sha2 = "0.10"
hex = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
regex = "1"
osmpbf = "0.3"
tiff = "0.11"
flate2 = "1"
object = { version = "0.41.0", default-features = false, features = ["read"] }
