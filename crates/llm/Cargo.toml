[package]
name = "lastbook-llm"
description = "Lastbook Europe's local AI runner: one model, one JSON object per line on standard input and output, no sockets."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "lastbook-llm"
path = "src/main.rs"

[dependencies]
llama-cpp-2 = { version = "0.1.161", default-features = false, features = ["common"] }
llama-cpp-sys-2 = { version = "0.1.161", default-features = false }
serde_json.workspace = true
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1.161", default-features = false, features = ["common", "metal"] }


[features]
# Windows and Linux: llama.cpp's backends as separate libraries beside the runner, Vulkan among them, each loaded only
# where it can run (a graphics card with its driver, else the best processor variant). Being made to build on GitHub's
# machines; until it does, those builds use the processor.
vulkan = ["llama-cpp-2/vulkan", "llama-cpp-2/dynamic-backends"]
