[package]
name = "lastbook-llm"
description = "Lastbook Europe's local AI runner: one model, one JSON object per line on standard input and output, no sockets."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "lastbook-llm"
path = "src/main.rs"

[dependencies]
llama-cpp-2 = { version = "0.1.161", default-features = false, features = ["common"] }
llama-cpp-sys-2 = { version = "0.1.161", default-features = false }
serde_json.workspace = true
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1.161", default-features = false, features = ["common", "metal"] }

# Windows and Linux: llama.cpp's backends are separate libraries beside the runner, each loaded only where it can run:
# Vulkan where the computer has a graphics card and its driver, else the best CPU variant for this processor.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
llama-cpp-2 = { version = "0.1.161", default-features = false, features = ["common", "vulkan", "dynamic-backends"] }
